<!--
  The Chinotto app icon, at the >=40px rung.

  The squircle is drawn at 824 inside a 1024 canvas with corner radius 185 — macOS expects
  the icon to bring its own shape rather than fill the square — and the mark occupies 0.62
  of that tile, tighter than it sits inside the app, where it breathes.

  The ring goes 2.5 -> 3 here so it holds at icon scale against the tile's own edge.

  This file is the description. The shipped rasters are drawn by
  `scripts/generate-identity.py`, which picks the rung for each size rather than scaling
  this one drawing down: at 32px and 16px the icon is drawn with one dot, not three.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="#141416"/>
  <g transform="translate(256.5 256.5) scale(7.984)" fill="none">
    <circle cx="32" cy="32" r="28" stroke="#e6e6e3" stroke-width="3"/>
    <circle cx="32" cy="23" r="8" fill="#e6e6e3"/>
    <circle cx="32" cy="38" r="4.5" fill="#e6e6e3"/>
    <circle cx="32" cy="47.5" r="2.5" fill="#e6e6e3"/>
  </g>
</svg>

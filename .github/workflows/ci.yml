name: ci

# What has to hold before a change lands: the types check and the suites pass.
# Packaging and signing are release.yml's job, not this one.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # macOS: the Rust suite compiles the Tauri app crate, and Chinotto desktop ships macOS only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # cargo test in src-tauri, then the Node and Vitest suites.
      - name: Test
        run: npm test
